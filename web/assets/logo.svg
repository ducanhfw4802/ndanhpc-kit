<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#090D16" stop-opacity="1"/>
    </radialGradient>

    <!-- Brand Flame Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F6821F"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="violetPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="highGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate & Ambient Halo -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#shieldBorder)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Antigravity Orbital Rings -->
  <g transform="translate(256, 256)" opacity="0.85">
    <!-- Outer Elliptical Orbit -->
    <ellipse rx="190" ry="76" fill="none" stroke="#F6821F" stroke-width="2.5" stroke-dasharray="14 10" transform="rotate(-30)" opacity="0.65"/>
    <ellipse rx="190" ry="76" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 14" transform="rotate(30)" opacity="0.55"/>

    <!-- Orbital Satellites (Agents Nodes) -->
    <g transform="rotate(-30)">
      <circle cx="190" cy="0" r="7" fill="#F6821F" filter="url(#glow)"/>
      <circle cx="-190" cy="0" r="5" fill="#FDBA74"/>
    </g>
    <g transform="rotate(30)">
      <circle cx="0" cy="76" r="6" fill="#38BDF8" filter="url(#glow)"/>
      <circle cx="0" cy="-76" r="5" fill="#38BDF8"/>
    </g>
  </g>

  <!-- Central Shield / Tech Core -->
  <g transform="translate(256, 256)">
    <!-- Hexagonal Core Backdrop -->
    <polygon points="0,-128 110,-64 110,64 0,128 -110,64 -110,-64" 
             fill="#0F172A" stroke="url(#shieldBorder)" stroke-width="3.5" filter="url(#glow)"/>

    <!-- Core Inner Geometric Lines -->
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" 
             fill="#141E33" opacity="0.9"/>

    <!-- Dynamic "N" + Antigravity Levitating Delta Glyph -->
    <!-- Left Column of N -->
    <path d="M-64,56 L-64,-56 L-34,-56 L-34,56 Z" fill="url(#brandGrad)"/>
    
    <!-- Right Column of N -->
    <path d="M34,56 L34,-56 L64,-56 L64,56 Z" fill="url(#brandGrad)"/>

    <!-- Central Levitating Energy Core / Upward Chevron Thrust -->
    <path d="M-44,-42 L0,28 L44,-42 L24,-42 L0,-4 L-24,-42 Z" 
          fill="url(#cyberCyan)" filter="url(#highGlow)"/>

    <!-- Zero-G Central Core Sphere (Pulsing Singularity) -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" filter="url(#highGlow)"/>
    <circle cx="0" cy="0" r="8" fill="#F6821F"/>

    <!-- Quantum Telemetry Corner Accents -->
    <line x1="-96" y1="-48" x2="-80" y2="-48" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <line x1="80" y1="48" x2="96" y2="48" stroke="#F6821F" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-118" x2="0" y2="-106" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="106" x2="0" y2="118" stroke="#F6821F" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
