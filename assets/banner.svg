<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>

    <radialGradient id="orangeAura" cx="24%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#F6821F" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F6821F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAura" cx="80%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Brand Typography Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F6821F"/>
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F6821F"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6821F" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="heavyGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur stdDeviation="28" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1.2" fill="#334155" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="420" rx="20" fill="url(#bgCanvas)"/>
  <rect width="1280" height="420" rx="20" fill="url(#techGrid)"/>
  <rect width="1280" height="420" rx="20" fill="url(#orangeAura)"/>
  <rect width="1280" height="420" rx="20" fill="url(#cyanAura)"/>

  <!-- Outer Tech Border & Corner Bracket Accents -->
  <rect x="2" y="2" width="1276" height="416" rx="18" fill="none" stroke="url(#cardBorderGrad)" stroke-width="2"/>
  
  <!-- Corner Tech Brackets -->
  <path d="M 28 44 L 28 28 L 44 28" fill="none" stroke="#F6821F" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1252 44 L 1252 28 L 1236 28" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 28 376 L 28 392 L 44 392" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1252 376 L 1252 392 L 1236 392" fill="none" stroke="#F6821F" stroke-width="3" stroke-linecap="round"/>

  <!-- Telemetry Coordinate Lines -->
  <line x1="60" y1="28" x2="300" y2="28" stroke="#1E293B" stroke-width="1.5"/>
  <text x="315" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B" letter-spacing="1.5">SYS.RUNTIME: GOOGLE ANTIGRAVITY // 6-PHASE CONTRACT // CALVER 2026.10.18</text>
  <line x1="880" y1="28" x2="1220" y2="28" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ======================================================== -->
  <!-- LEFT: 3D ANTIGRAVITY ORBITAL ICON & MULTI-AGENT CLUSTER  -->
  <!-- ======================================================== -->
  <g transform="translate(195, 210)">
    <!-- Ambient Backdrop Disc -->
    <circle cx="0" cy="0" r="140" fill="#0A101D" stroke="#1E293B" stroke-width="2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#F6821F" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

    <!-- Orbital Ring 1 (Rotated -32 deg) -->
    <ellipse rx="135" ry="52" fill="none" stroke="url(#flameGrad)" stroke-width="2.5" stroke-dasharray="16 10" transform="rotate(-32)" opacity="0.85" filter="url(#softGlow)"/>
    <!-- Orbital Nodes (Agents) -->
    <g transform="rotate(-32)">
      <circle cx="135" cy="0" r="7.5" fill="#F6821F" filter="url(#heavyGlow)"/>
      <circle cx="-135" cy="0" r="5" fill="#FDBA74"/>
    </g>

    <!-- Orbital Ring 2 (Rotated 32 deg) -->
    <ellipse rx="135" ry="52" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="10 14" transform="rotate(32)" opacity="0.75" filter="url(#softGlow)"/>
    <!-- Orbital Nodes (Skills) -->
    <g transform="rotate(32)">
      <circle cx="0" cy="52" r="6" fill="#38BDF8" filter="url(#heavyGlow)"/>
      <circle cx="0" cy="-52" r="4.5" fill="#38BDF8"/>
    </g>

    <!-- Orbital Ring 3 (Equatorial) -->
    <ellipse rx="100" ry="100" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Core Hexagonal Tech Shield -->
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" 
             fill="#0B1324" stroke="url(#cardBorderGrad)" stroke-width="3" filter="url(#softGlow)"/>
    <polygon points="0,-68 59,-34 59,34 0,68 -59,34 -59,-34" 
             fill="#0E1A32" opacity="0.95"/>

    <!-- Dynamic "N" + Upward Delta Thrust -->
    <path d="M-40,36 L-40,-36 L-20,-36 L-20,36 Z" fill="url(#flameGrad)"/>
    <path d="M20,36 L20,-36 L40,-36 L40,36 Z" fill="url(#flameGrad)"/>
    
    <!-- Central Levitating Energy Core / Upward Chevron -->
    <path d="M-28,-26 L0,18 L28,-26 L15,-26 L0,-3 L-15,-26 Z" 
          fill="url(#cyanGrad)" filter="url(#heavyGlow)"/>

    <!-- Center White/Gold Pulsing Singularity -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" filter="url(#heavyGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#F6821F"/>

    <!-- Satellite Agent Micro-nodes with Quantum Links -->
    <line x1="0" y1="0" x2="85" y2="-90" stroke="#F6821F" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
    <circle cx="85" cy="-90" r="6" fill="#F6821F" filter="url(#softGlow)"/>

    <line x1="0" y1="0" x2="-95" y2="85" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.6"/>
    <circle cx="-95" cy="85" r="5" fill="#38BDF8" filter="url(#softGlow)"/>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT: BRAND TYPOGRAPHY, STATS & ECOSYSTEM HIGHLIGHTS    -->
  <!-- ======================================================== -->
  <g transform="translate(415, 0)">
    <!-- Top Pill: Status & Platform Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="460" height="28" rx="14" fill="#0F1E36" stroke="#1E3A5F" stroke-width="1.2"/>
      <circle cx="16" cy="14" r="4.5" fill="#10B981" filter="url(#softGlow)"/>
      <text x="30" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#38BDF8" letter-spacing="0.5">
        ANTIGRAVITY NATIVE RUNTIME <tspan fill="#64748B">•</tspan> <tspan fill="#FDBA74">v2026.10.18 STABLE</tspan>
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="162" font-family="'Inter', -apple-system, sans-serif" font-size="56" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.5">
      NDANHPC KIT
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="202" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="-0.2">
      Antigravity-Native AI Agent Capability Toolkit
    </text>

    <!-- Value Proposition Sentence -->
    <text x="0" y="235" font-family="'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#64748B">
      Hệ sinh thái đa tác nhân khép kín: Tự động phân luồng, tải ngữ cảnh lũy tiến &amp; bảo vệ an toàn PreToolUse.
    </text>

    <!-- Stats & Capabilities Cards Row -->
    <g transform="translate(0, 268)">
      <!-- Card 1: Agents -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="68" rx="12" fill="#0D1629" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#38BDF8">24</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">Specialist Agents</text>
        <circle cx="122" cy="24" r="3" fill="#38BDF8"/>
      </g>

      <!-- Card 2: Modular Skills -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="144" height="68" rx="12" fill="#0D1629" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#F6821F">62</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">Modular Skills</text>
        <circle cx="122" cy="24" r="3" fill="#F6821F"/>
      </g>

      <!-- Card 3: Workflows -->
      <g transform="translate(312, 0)">
        <rect x="0" y="0" width="144" height="68" rx="12" fill="#0D1629" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#10B981">30</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">Slash Workflows</text>
        <circle cx="122" cy="24" r="3" fill="#10B981"/>
      </g>

      <!-- Card 4: Strict Rules -->
      <g transform="translate(468, 0)">
        <rect x="0" y="0" width="144" height="68" rx="12" fill="#0D1629" stroke="#1E293B" stroke-width="1.2"/>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#A855F7">7</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#94A3B8">Strict Rules</text>
        <circle cx="122" cy="24" r="3" fill="#A855F7"/>
      </g>

      <!-- Card 5: Total Verified Components -->
      <g transform="translate(624, 0)">
        <rect x="0" y="0" width="170" height="68" rx="12" fill="#121F38" stroke="#F6821F" stroke-width="1.4" stroke-opacity="0.8"/>
        <text x="16" y="32" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">123</text>
        <text x="16" y="52" font-family="'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#FDBA74">Components Locked</text>
        <circle cx="148" cy="24" r="4" fill="#10B981" filter="url(#softGlow)"/>
      </g>
    </g>

    <!-- Bottom Feature Tags Row -->
    <g transform="translate(0, 356)">
      <rect x="0" y="0" width="118" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">🎨 UI/UX Pro Max</text>

      <rect x="128" y="0" width="138" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="138" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">🧪 QA Supercharge</text>

      <rect x="276" y="0" width="128" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="286" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">🛡️ PreToolUse Hook</text>

      <rect x="414" y="0" width="136" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="424" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">⚡ 1-Line Remote CLI</text>

      <rect x="560" y="0" width="122" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="570" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">🌐 Web + TUI Portal</text>
    </g>
  </g>
</svg>
